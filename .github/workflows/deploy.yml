name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ridgerisemedia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Contabo
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "Missing secret: DEPLOY_HOST"; exit 1; }
          if [ -z "${DEPLOY_SSH_KEY:-}" ] && [ -z "${DEPLOY_SSH_KEY_B64:-}" ]; then
            echo "Missing secret: set DEPLOY_SSH_KEY_B64 (preferred) or DEPLOY_SSH_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Prefer base64 — GitHub secrets often break PEM newlines and cause libcrypto errors.
          if [ -n "${DEPLOY_SSH_KEY_B64:-}" ]; then
            echo "$DEPLOY_SSH_KEY_B64" | tr -d '\n\r\t ' | base64 -d > ~/.ssh/deploy_key
          else
            KEY="$DEPLOY_SSH_KEY"
            # If pasted with literal \n sequences, expand them.
            if printf '%s' "$KEY" | grep -q '\\n'; then
              KEY="$(printf '%b' "$KEY")"
            fi
            printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          fi

          # Normalize line endings / ensure trailing newline
          tr -d '\r' < ~/.ssh/deploy_key > ~/.ssh/deploy_key.tmp
          mv ~/.ssh/deploy_key.tmp ~/.ssh/deploy_key
          [ -n "$(tail -c1 ~/.ssh/deploy_key)" ] && echo >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY is invalid (libcrypto / bad PEM)."
            echo "Regenerate and store as base64:"
            echo "  ssh-keygen -t ed25519 -C gh-actions-ridgerise -f ./ridgerise_deploy -N ''"
            echo "  ssh-copy-id -i ./ridgerise_deploy.pub root@YOUR_HOST"
            echo "  base64 -i ./ridgerise_deploy | pbcopy   # macOS — paste into DEPLOY_SSH_KEY_B64"
            exit 1
          fi

          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync dist to /var/www/ridgerisemedia
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          USER="${DEPLOY_USER:-root}"
          PORT="${DEPLOY_PORT:-22}"
          PATH_REMOTE="${DEPLOY_PATH:-/var/www/ridgerisemedia}"

          # Only this site path is updated — never landers Docker stack or other vhosts.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./dist/ \
            "${USER}@${DEPLOY_HOST}:${PATH_REMOTE}/"

      - name: Verify remote index
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          USER="${DEPLOY_USER:-root}"
          PORT="${DEPLOY_PORT:-22}"
          PATH_REMOTE="${DEPLOY_PATH:-/var/www/ridgerisemedia}"

          ssh -i ~/.ssh/deploy_key -p "${PORT}" -o IdentitiesOnly=yes \
            "${USER}@${DEPLOY_HOST}" \
            "test -f '${PATH_REMOTE}/index.html' && ls -la '${PATH_REMOTE}' | head -20"
